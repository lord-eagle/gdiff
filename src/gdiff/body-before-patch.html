</head>
<body>
<header class="topbar">
  <div class="top-left">
    <button type="button" class="sidebar-toggle" id="sidebar-toggle-top" title="Show files sidebar" aria-label="Show files sidebar">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.5 3.5h11v9h-11z"/><path d="M6 3.5v9"/></svg>
    </button>
    <div class="title"><span class="wordmark">gdiff</span><span class="title-repo">$repo_name</span></div>
  </div>
  <div class="top-actions">
    <div class="view-toggle" aria-label="Diff view">
      <button type="button" id="view-split" data-diff-style="split">Side by side</button>
      <button type="button" id="view-unified" data-diff-style="unified">Stacked</button>
    </div>
    <button type="button" id="theme-toggle" class="icon-btn" title="Toggle light / dark" aria-label="Toggle light or dark theme">
      <svg class="moon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6 1.6a6.4 6.4 0 1 0 8.4 8.4A5 5 0 1 1 6 1.6z"/></svg>
      <svg class="sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="3.1"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M12.8 3.2l-1.4 1.4M4.6 11.4l-1.4 1.4" stroke-linecap="round"/></svg>
    </button>
    <button type="button" id="help-toggle" class="icon-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.4"/><path d="M6.2 6.1a1.9 1.9 0 1 1 2.5 1.8c-.5.2-.7.5-.7 1v.3" stroke-linecap="round"/><circle cx="8" cy="11.4" r="0.65" fill="currentColor" stroke="none"/></svg>
    </button>
    <div class="stats" id="stats"></div>
  </div>
</header>
<div class="app-shell">
  <aside class="file-tree" aria-label="Changed files">
    <div class="file-tree-title"><span>Files</span><button type="button" class="sidebar-toggle" id="sidebar-toggle-tree" title="Collapse files sidebar" aria-label="Collapse files sidebar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.5 3.5h11v9h-11z"/><path d="M6 3.5v9"/></svg></button></div>
    <div class="file-tree-search"><input id="file-search" type="search" placeholder="Filter files..."></div>
    <div class="tree-meta">
      <span class="tree-progress" id="tree-progress"></span>
      <label class="tree-filter"><input type="checkbox" id="unreviewed-only"> Unreviewed only</label>
    </div>
    <nav class="file-tree-list is-initial" id="file-list"></nav>
    <div class="untracked-panel" id="untracked-panel" hidden>
      <div class="untracked-title">Untracked <span class="untracked-hint">not in diff</span></div>
      <div class="untracked-list" id="untracked-list"></div>
    </div>
  </aside>
  <main id="viewer"></main>
</div>
<div class="review-bar">
  <button type="button" id="review-count-button" class="review-count-label" title="Show all stored comments"><span id="review-count">0</span> <span id="review-noun">comments</span><span id="review-files"></span></button>
  <button type="button" id="copy-comments" class="primary">Copy prompt</button>
  <button type="button" id="clear-comments">Clear</button>
</div>
<div class="help-overlay" id="help-overlay">
  <div class="help-card" role="dialog" aria-label="Keyboard shortcuts">
    <h2>Review shortcuts</h2>
    <p>gdiff — Atelier</p>
    <div class="help-row"><span>Next / previous file</span><span><kbd>↓</kbd> <kbd>↑</kbd> <kbd>n</kbd> <kbd>p</kbd></span></div>
    <div class="help-row"><span>Toggle "viewed" on active file</span><kbd>v</kbd></div>
    <div class="help-row"><span>Comment on active file</span><kbd>c</kbd></div>
    <div class="help-row"><span>Show / hide this help</span><kbd>?</kbd></div>
  </div>
</div>
<script id="patch-data" type="text/plain">
